name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agenda
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenda" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Crear rol de la app (sin superusuario, para que RLS aplique)
        working-directory: .
        run: >
          PGPASSWORD=agenda psql -h localhost -U agenda -d agenda -v ON_ERROR_STOP=1
          -v app_user=agenda_app -v app_password=agenda_app
          -f docker/postgres/create_app_role.sql
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Reservar → completar → comisión con un navegador real (M10, spec §14).
    # Versión fija: `ubuntu-latest` está pasando a Ubuntu 26 y `playwright install --with-deps`
    # todavía no sabe instalar las librerías de Chromium en esa versión.
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Primero las dependencias del host: el contenedor `web` monta un volumen en
      # frontend/node_modules y Docker crearía esa carpeta como root, y `npm ci` ya no podría
      # escribir ahí (falla con código 243).
      - run: npm ci
        working-directory: frontend
      # Chromium en caché entre corridas (la clave cambia con la versión de Playwright). Las
      # librerías del sistema se instalan siempre; cada intento tiene tope de 5 minutos y se
      # reintenta hasta 3 veces, porque la descarga a veces se cuelga en la máquina de GitHub.
      - name: Versión de Playwright
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar Chromium y sus librerías
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "Intento $attempt falló; reintentando en 15 s"
            sleep 15
          done
          exit 1
      - name: Levantar el sistema completo
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS -H "Host: admin.localhost" http://localhost:8080/healthz/ >/dev/null \
              && curl -fsS -H "Host: admin.localhost" http://localhost:8080/ >/dev/null && break
            sleep 5
          done
          curl -fsS -H "Host: admin.localhost" http://localhost:8080/healthz/
      - run: npx playwright test
        working-directory: frontend
      - name: Reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Logs del sistema si falla
        if: failure()
        # Si el sistema no llegó a levantarse no hay .env ni logs: que este paso no tape el error.
        run: docker compose logs --no-color --tail=300 || true
