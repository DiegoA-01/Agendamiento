[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["migrations/"]

# factory-boy no trae tipos: en los tests mypy confunde las factories con los modelos.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
# --ds gana sobre la variable de entorno DJANGO_SETTINGS_MODULE (que apunta a dev en Docker y CI).
addopts = "-ra --ds=config.settings.test"
